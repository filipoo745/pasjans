<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#124d25">
  <title>Pasjans</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="brand"><span class="logo">♠&#xFE0E;</span><span class="txt">Pasjans</span></div>
      <div class="stats">
        <span>Czas <b id="time">0:00</b></span>
        <span>Ruchy <b id="moves">0</b></span>
        <span>Punkty <b id="score">0</b></span>
      </div>
      <div class="actions">
        <button class="btn" id="btn-new" title="Nowa gra">✚<span class="lbl"> Nowa gra</span></button>
        <button class="btn" id="btn-undo" title="Cofnij (Ctrl+Z)">↶<span class="lbl"> Cofnij</span></button>
        <button class="btn" id="btn-hint" title="Podpowiedź (H)">?<span class="lbl"> Podpowiedź</span></button>
        <button class="btn" id="btn-settings" title="Ustawienia i wygląd">⚙<span class="lbl"> Wygląd</span></button>
      </div>
    </header>
    <main id="board" aria-label="Stół do gry"></main>
  </div>

  <button class="btn primary" id="btn-auto" hidden>Dokończ automatycznie ✨</button>
  <div id="toast" role="status"></div>
  <canvas id="confetti" hidden></canvas>

  <div id="win" class="modal" hidden>
    <div class="modal-card">
      <h2>Wygrana!</h2>
      <p id="win-stats"></p>
      <button class="btn primary" id="btn-again">Zagraj ponownie</button>
    </div>
  </div>

  <div id="overlay" hidden></div>
  <aside id="settings" class="drawer" aria-label="Ustawienia">
    <div class="drawer-head">
      <h2>Ustawienia</h2>
      <button class="icon-btn" id="close-settings" aria-label="Zamknij">✕</button>
    </div>

    <section>
      <h3>Gra</h3>
      <div class="seg" id="draw-seg">
        <button data-draw="1">Dobieraj 1 kartę</button>
        <button data-draw="3">Dobieraj 3 karty</button>
      </div>
      <label class="check"><input type="checkbox" id="opt-anim"> Animacje</label>
      <p class="muted" id="stats-line"></p>
    </section>

    <section>
      <h3>Motyw</h3>
      <div id="theme-list" class="theme-list"></div>
    </section>

    <section>
      <h3>Dostosuj</h3>
      <p class="muted">Zmiany nakładają się na wybrany motyw i zapisują automatycznie.</p>
      <div id="custom-colors" class="color-grid"></div>
      <label class="row">Wzór rewersu <select id="opt-pattern"></select></label>
      <label class="row">Czcionka kart <select id="opt-font"></select></label>
      <label class="row">Zaokrąglenie rogów <input type="range" id="opt-radius" min="0" max="1" step="0.05"></label>
      <label class="check"><input type="checkbox" id="opt-four"> Talia 4-kolorowa (karo i trefl w innych kolorach)</label>
      <div class="btn-row">
        <button class="btn-s" id="btn-reset-custom">Przywróć motyw</button>
        <button class="btn-s" id="btn-export">Eksportuj motyw</button>
      </div>
      <textarea id="export-box" hidden readonly spellcheck="false"></textarea>
    </section>

    <section>
      <h3>Skróty</h3>
      <p class="muted">Kliknięcie karty – automatyczny ruch · Przeciągnij – dowolny ruch · Spacja – dobierz · H – podpowiedź · Ctrl/⌘+Z – cofnij</p>
    </section>
  </aside>

  <script src="js/themes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
